<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ship Guard</title>
  <style>:root {
  --bg: var(--color-background-primary, #111318);
  --surface: var(--color-background-secondary, #1a1d24);
  --surface-hover: var(--color-background-tertiary, #222631);
  --text: var(--color-text-primary, #eceff4);
  --muted: var(--color-text-secondary, #9aa4b2);
  --border: var(--color-border-primary, #2c3240);
  --accent: #3b82f6;
  --accent-soft: rgba(59, 130, 246, 0.16);
  --ok: #22c55e;
  --ok-soft: rgba(34, 197, 94, 0.15);
  --warn: #f59e0b;
  --warn-soft: rgba(245, 158, 11, 0.16);
  --danger: #ef4444;
  --danger-soft: rgba(239, 68, 68, 0.16);
  --radius: var(--border-radius-md, 8px);
  --font-sans: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
  --font-mono: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.45;
}

.app-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  max-width: 980px;
  margin: 0 auto;
  padding: 10px 12px 24px;
  gap: 10px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 7px;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: -0.01em;
}

.brand-icon {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: linear-gradient(135deg, #2563eb, #10b981);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 12px;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 3px;
}

.tab-btn {
  appearance: none;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  padding: 7px 6px;
  border-radius: 6px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: background 0.15s, color 0.15s;
}

.tab-btn:hover {
  color: var(--text);
  background: var(--surface-hover);
}

.tab-btn.active {
  background: var(--accent);
  color: #fff;
}

.repo-bar {
  display: flex;
  gap: 6px;
  align-items: center;
}

.input,
.textarea {
  width: 100%;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 7px 9px;
  font-family: inherit;
  font-size: 12px;
  outline: none;
}

.input:focus,
.textarea:focus {
  border-color: var(--accent);
}

.input-mono {
  font-family: var(--font-mono);
  font-size: 11.5px;
}

.btn {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  border-radius: var(--radius);
  padding: 6px 10px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  white-space: nowrap;
  transition: background 0.15s, border-color 0.15s, opacity 0.15s;
}

.btn:hover:not(:disabled) {
  background: var(--surface-hover);
  border-color: var(--muted);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.btn-primary:hover:not(:disabled) {
  background: #2563eb;
  border-color: #2563eb;
}

.btn-danger {
  background: var(--danger-soft);
  border-color: rgba(239, 68, 68, 0.4);
  color: #fca5a5;
}

.btn-danger:hover:not(:disabled) {
  background: rgba(239, 68, 68, 0.28);
}

.btn-ok {
  background: var(--ok-soft);
  border-color: rgba(34, 197, 94, 0.4);
  color: #86efac;
}

.btn-sm {
  padding: 4px 8px;
  font-size: 11px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 11px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.card-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
}

.row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.row-between {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  background: var(--surface-hover);
  color: var(--text);
  border: 1px solid var(--border);
}

.badge-ok {
  background: var(--ok-soft);
  color: #4ade80;
  border-color: rgba(34, 197, 94, 0.35);
}

.badge-warn {
  background: var(--warn-soft);
  color: #fbbf24;
  border-color: rgba(245, 158, 11, 0.35);
}

.badge-danger {
  background: var(--danger-soft);
  color: #f87171;
  border-color: rgba(239, 68, 68, 0.35);
}

.badge-accent {
  background: var(--accent-soft);
  color: #60a5fa;
  border-color: rgba(59, 130, 246, 0.35);
}

.list {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.list-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 8px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid var(--border);
}

.list-item-col {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  flex: 1;
}

.mono {
  font-family: var(--font-mono);
  font-size: 11.5px;
}

.truncate {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.muted {
  color: var(--muted);
  font-size: 11.5px;
}

.empty {
  text-align: center;
  padding: 14px 8px;
  color: var(--muted);
  font-size: 12px;
}

.toast {
  padding: 8px 10px;
  border-radius: var(--radius);
  font-size: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.toast-ok {
  border-color: rgba(34, 197, 94, 0.45);
  background: var(--ok-soft);
}

.toast-err {
  border-color: rgba(239, 68, 68, 0.45);
  background: var(--danger-soft);
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.stat-box {
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 8px;
  text-align: center;
}

.stat-val {
  font-size: 16px;
  font-weight: 700;
}

.stat-lbl {
  font-size: 10.5px;
  color: var(--muted);
  text-transform: uppercase;
}

.code-output {
  margin: 4px 0 0;
  padding: 8px;
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 11px;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 180px;
  overflow-y: auto;
  color: var(--text);
}

.confirm-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 7px 9px;
  border-radius: 6px;
  background: var(--warn-soft);
  border: 1px solid rgba(245, 158, 11, 0.45);
  font-size: 11.5px;
}
</style>
